appId: com.kbj.pandalivemonitor
productName: PandaLive Monitor
copyright: Copyright © 2026
directories:
  output: release
files:
  - out/**
  - package.json
  - resources/icon.png
  - node_modules/ffmpeg-static/**
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  artifactName: '${productName}-${version}-${arch}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: PandaLive Monitor
  createDesktopShortcut: true
  artifactName: '${productName}-Setup-${version}.${ext}'
portable:
  artifactName: '${productName}-Portable-${version}.${ext}'
# mac: 免签名分发(CI 已设 CSC_IDENTITY_AUTO_DISCOVERY=false; 首次打开需右键打开, 见 README)
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.utilities
  artifactName: '${productName}-${version}-${arch}.${ext}'
# linux: AppImage(免安装) + deb(带 libsecret 依赖保证 Cookie 加密可用)
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Utility
  maintainer: Joftal # deb 需要维护者元数据(否则 FpmTarget 构建失败)
  artifactName: '${productName}-${version}-${arch}.${ext}'
deb:
  depends:
    - libsecret-1-0
